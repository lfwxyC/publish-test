name: Python CI

on:
  push:
    branches: ['**']
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '测试通过后发布到 TestPyPI'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装构建工具
        run: python -m pip install --upgrade build twine
      - name: 构建并检查发布文件
        run: |
          python -m build
          python -m twine check --strict dist/*
      # 安装 wheel 后运行测试，避免仅在源码目录中运行成功。
      - name: 验证安装包和公共接口
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -v
      - name: 保存 Python 安装包
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布到 TestPyPI
    needs: build
    # 只有从默认分支手动勾选发布才上传，普通 push 和 PR 只构建。
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: dist/
      # 与 TestPyPI 配置的 Trusted Publisher 对应，无需保存发布 Token。
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
