name: Node CI

on:
  push:
    branches: ['**']
    paths:
      - 'node/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'node/**'
      - '.github/workflows/node-ci.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '测试通过后发布到正式 npm（首次发布需配置 NPM_TOKEN）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      # 自动填写实际仓库元信息，供 npm 发布来源校验使用。
      - name: 设置包的仓库地址
        run: npm pkg set 'repository.type=git' "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" 'repository.directory=node'
      - name: 测试和打包
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: 保存 npm 安装包
        uses: actions/upload-artifact@v7
        with:
          name: node-dist
          path: node/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布到 npm
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    # 首次发布使用 Token；绑定可信发布者后，将此权限改为 id-token: write。
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: node-dist
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: 更新 npm 工具
        run: npm install --global npm@11
      # 首次发布读取 GitHub Secret，Token 仅提供给发布步骤。
      # 绑定可信发布者后移除此 env，使用 OIDC 认证。
      - name: 发布 npm 安装包
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::请先在仓库 Settings → Secrets and variables → Actions 配置 NPM_TOKEN。"
            exit 1
          fi
          npm publish ./dist/*.tgz --access public
